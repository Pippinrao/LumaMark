name: V1 Quality Gate

on:
  push:
    branches:
      - main
      - v1-implementation
  pull_request:
    branches:
      - main
      - v1-implementation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  npm_config_registry: https://registry.npmmirror.com/
  PLAYWRIGHT_DOWNLOAD_HOST: https://npmmirror.com/mirrors/playwright

jobs:
  frontend-static:
    name: Frontend typecheck and lint
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmmirror.com/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  frontend-unit:
    name: Frontend unit
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmmirror.com/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit and integration tests
        run: pnpm test

      - name: Fixture round-trip tests
        run: pnpm test:fixtures

      - name: Windows updater proxy dependency gate
        run: pnpm quality:updater-proxy

  frontend-corpus:
    name: Markdown corpus
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmmirror.com/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Markdown corpus
        run: pnpm download:markdown-corpus

      - name: Markdown corpus parser tests
        run: pnpm test:markdown-corpus


  rust-quality:
    name: Rust quality
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmmirror.com/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Live remote image assets
        timeout-minutes: 2
        run: pnpm test:live-assets

  web-ux:
    name: V1 UX prototype and screenshots
    runs-on: windows-latest
    timeout-minutes: 20
    # Job-level env cannot use the `runner` context (GitHub rejects the
    # workflow before any job starts). Keep this path workspace-relative.
    env:
      PLAYWRIGHT_BROWSERS_PATH: .ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmmirror.com/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: .ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: V1 UX prototype gate
        run: pnpm quality:v1-ux-prototype

      - name: Capture V1 UX review screenshots
        run: pnpm quality:v1-ux-screenshots

      - name: Upload V1 UX screenshots
        uses: actions/upload-artifact@v7
        with:
          name: v1-ux-screenshots
          path: test-results/v1-ux-screenshots/*.png
          if-no-files-found: error

  web-production:
    name: Web build and production E2E
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: .ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmmirror.com/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: .ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Web build chunk gate
        run: pnpm quality:web-build

      - name: Production bundle startup
        run: pnpm exec playwright test --config playwright.production.config.ts

  e2e:
    name: E2E tests (${{ matrix.shard }}/6)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PLAYWRIGHT_BROWSERS_PATH: .ms-playwright
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmmirror.com/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: .ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: E2E tests
        # pnpm 11 forwards a literal `--` to Playwright, which then treats
        # `--shard=` as a file path and runs the full suite on every VM.
        run: pnpm test:e2e --shard=${{ matrix.shard }}/6

  perf:
    name: Performance benchmarks
    needs:
      - frontend-static
      - frontend-unit
      - frontend-corpus
      - rust-quality
      - web-ux
      - e2e
      - web-production
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmmirror.com/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Performance benchmarks
        run: pnpm perf:bench
