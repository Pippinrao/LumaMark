name: Windows Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-artifacts:
    name: Build Windows artifacts
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      npm_config_registry: https://registry.npmmirror.com/

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmmirror.com/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows release artifacts
        run: pnpm build

      - name: Upload release executable
        uses: actions/upload-artifact@v7
        with:
          name: lumamark-windows-release-exe
          if-no-files-found: error
          path: src-tauri/target/release/lumamark.exe

      - name: Upload MSI installer
        uses: actions/upload-artifact@v7
        with:
          name: lumamark-windows-msi
          if-no-files-found: error
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v7
        with:
          name: lumamark-windows-nsis
          if-no-files-found: error
          path: src-tauri/target/release/bundle/nsis/*setup.exe
