name: Windows Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-artifacts:
    name: Build Windows artifacts
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      npm_config_registry: https://registry.npmmirror.com/

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmmirror.com/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare updater signing key
        uses: ./.github/actions/prepare-tauri-signing
        with:
          private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          private-key-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build Windows release artifacts
        run: pnpm build

      - name: Require signed NSIS artifacts
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $nsisDir = 'src-tauri/target/release/bundle/nsis'
          $sig = Join-Path $nsisDir "LumaMark_${version}_x64-setup.exe.sig"
          if (-not (Test-Path -LiteralPath $sig)) {
            throw "Signed NSIS *.sig is missing at $sig. Unsigned CI installers are not release artifacts."
          }
          if ((Get-Item -LiteralPath $sig).Length -lt 32) {
            throw "Updater signature $sig is empty or truncated."
          }
          $sigs = @(Get-ChildItem -LiteralPath $nsisDir -Filter '*.sig' -ErrorAction Stop)
          if ($sigs.Count -ne 1) {
            throw "Expected exactly one signed NSIS *.sig in $nsisDir, found $($sigs.Count)."
          }

      - name: Verify Windows release artifacts
        run: pnpm release:verify-artifacts > src-tauri/target/release/lumamark-windows-artifacts.json

      - name: Upload release artifact manifest
        uses: actions/upload-artifact@v7
        with:
          name: lumamark-windows-artifact-manifest
          if-no-files-found: error
          path: src-tauri/target/release/lumamark-windows-artifacts.json

      - name: Upload release executable
        uses: actions/upload-artifact@v7
        with:
          name: lumamark-windows-release-exe
          if-no-files-found: error
          path: src-tauri/target/release/lumamark.exe

      - name: Upload MSI installer
        uses: actions/upload-artifact@v7
        with:
          name: lumamark-windows-msi
          if-no-files-found: error
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v7
        with:
          name: lumamark-windows-nsis
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*setup.exe
            src-tauri/target/release/bundle/nsis/*setup.exe.sig
