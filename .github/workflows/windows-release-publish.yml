name: Windows Release Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (must match package.json version, e.g. v0.2.17)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-windows-nsis:
    name: Publish Windows NSIS release
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      npm_config_registry: https://registry.npmmirror.com/
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmmirror.com/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          } elseif ($env:INPUT_TAG) {
            $tag = $env:INPUT_TAG
          } else {
            $tag = "v$packageVersion"
          }

          if ($tag -notmatch '^v(.+)$') {
            throw "Release tag must look like v0.2.17, got: $tag"
          }
          $tagVersion = $Matches[1]
          if ($tagVersion -ne $packageVersion) {
            throw "Tag version $tagVersion does not match package.json version $packageVersion"
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Verify version consistency
        run: pnpm release:verify-versions -- --expected-version ${{ steps.version.outputs.version }}

      - name: Require updater signing key
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'TAURI_SIGNING_PRIVATE_KEY secret is required to publish updater artifacts.'
          }

          # GitHub secret values are sometimes pasted from UTF-8 files with a BOM.
          # Tauri's minisign base64 decoder then fails with "Invalid symbol 239".
          $key = $env:TAURI_SIGNING_PRIVATE_KEY.Trim().TrimStart([char]0xFEFF)
          $utf8 = [System.Text.Encoding]::UTF8
          $bytes = $utf8.GetBytes($key)
          if (
            $bytes.Length -ge 3 -and
            $bytes[0] -eq 0xEF -and
            $bytes[1] -eq 0xBB -and
            $bytes[2] -eq 0xBF
          ) {
            $key = $utf8.GetString($bytes, 3, $bytes.Length - 3).Trim()
          }

          if ([string]::IsNullOrWhiteSpace($key)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is empty after BOM/whitespace sanitization.'
          }

          $keyPath = Join-Path $env:RUNNER_TEMP 'tauri-signing.key'
          [System.IO.File]::WriteAllText($keyPath, $key, [System.Text.UTF8Encoding]::new($false))
          # Overwrite the job-level secret env (may contain UTF-8 BOM) for later steps.
          @(
            "TAURI_SIGNING_PRIVATE_KEY_PATH=$keyPath"
            'TAURI_SIGNING_PRIVATE_KEY<<__TAURI_KEY_EOF__'
            $key
            '__TAURI_KEY_EOF__'
          ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          if ($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            $password = $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD.Trim().TrimStart([char]0xFEFF)
            $passwordBytes = $utf8.GetBytes($password)
            if (
              $passwordBytes.Length -ge 3 -and
              $passwordBytes[0] -eq 0xEF -and
              $passwordBytes[1] -eq 0xBB -and
              $passwordBytes[2] -eq 0xBF
            ) {
              $password = $utf8.GetString(
                $passwordBytes,
                3,
                $passwordBytes.Length - 3
              ).Trim()
            }
            @(
              'TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<__TAURI_PASSWORD_EOF__'
              $password
              '__TAURI_PASSWORD_EOF__'
            ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Build NSIS installer with updater artifacts
        run: pnpm build:nsis

      - name: Generate updater manifest
        run: pnpm release:generate-updater-manifest

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $nsisDir = 'src-tauri/target/release/bundle/nsis'
          $setup = Join-Path $nsisDir "LumaMark_${env:VERSION}_x64-setup.exe"
          $sig = "$setup.sig"
          $latest = Join-Path $nsisDir 'latest.json'

          foreach ($path in @($setup, $sig, $latest)) {
            if (-not (Test-Path $path)) {
              throw "Missing release asset: $path"
            }
          }

          gh release create $env:TAG `
            $setup `
            $sig `
            $latest `
            --title "LumaMark $env:VERSION" `
            --generate-notes `
            --latest
