[package]
name = "lumamark"
version = "0.1.0"
description = "LumaMark desktop application"
authors = ["LumaMark Contributors"]
edition = "2021"

[lib]
name = "lumamark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lumamark"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
