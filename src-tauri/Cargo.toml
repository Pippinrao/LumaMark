[package]
name = "lumamark"
version = "0.2.50"
description = "LumaMark desktop application"
authors = ["LumaMark Contributors"]
edition = "2021"

[lib]
name = "lumamark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lumamark"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atomic-write-file = "0.3.0"
notify-debouncer-full = { version = "0.7.0", registry = "aliyun" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = { version = "0.11.0", registry = "aliyun" }
ureq = { version = "3.3.0", registry = "aliyun" }
uuid = { version = "1.23.4", features = ["v4"] }
tauri-plugin-updater = { version = "2.10.1", features = ["default"] }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "=0.13.4", default-features = false, features = ["system-proxy"] }
